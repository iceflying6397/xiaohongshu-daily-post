<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小机器人素材库</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#123760;font:16px system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px}h1{font-size:36px;margin:0 0 8px}p{color:#54718f;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:9px 22px;border:1px solid #cadbea;background:white;color:#123760;border-radius:30px;cursor:pointer}button.on{background:#123760;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border:1px solid #e4e9ea;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.caption{padding:13px 16px;font-weight:650;display:flex;justify-content:space-between}.caption small{color:#7594ad;font-weight:400}.card a{color:inherit;text-decoration:none}.card a:hover img{opacity:.9}footer{margin-top:24px;color:#54718f;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}}
</style><main><h1>小机器人素材库</h1><p>A｜圆润助手 · 项目统一角色<br>点击图片可查看原图；后续配图以标准形象为参考，按需要搭配角度、表情和动作。</p><nav><button data-filter="全部" class="on">全部 18 张</button><button data-filter="角度">角度</button><button data-filter="表情">表情</button><button data-filter="动作">动作</button></nav><div class="grid" id="grid"></div><footer><a href="标准参考/A-标准形象.png">查看标准形象</a> · 奶油白 / 深蓝 / 淡蓝 / 橙色</footer></main><script>
const items=[{"group": "角度", "name": "正面", "path": "角度/01-正面.png"}, {"group": "角度", "name": "左侧", "path": "角度/02-左侧.png"}, {"group": "角度", "name": "右侧", "path": "角度/03-右侧.png"}, {"group": "角度", "name": "背面", "path": "角度/04-背面.png"}, {"group": "角度", "name": "左前四分之三", "path": "角度/05-左前四分之三.png"}, {"group": "角度", "name": "右前四分之三", "path": "角度/06-右前四分之三.png"}, {"group": "表情", "name": "开心", "path": "表情/01-开心.png"}, {"group": "表情", "name": "思考", "path": "表情/02-思考.png"}, {"group": "表情", "name": "疑惑", "path": "表情/03-疑惑.png"}, {"group": "表情", "name": "惊讶", "path": "表情/04-惊讶.png"}, {"group": "表情", "name": "难过", "path": "表情/05-难过.png"}, {"group": "表情", "name": "得意", "path": "表情/06-得意.png"}, {"group": "动作", "name": "招手", "path": "动作/01-招手.png"}, {"group": "动作", "name": "讲解", "path": "动作/02-讲解.png"}, {"group": "动作", "name": "指向", "path": "动作/03-指向.png"}, {"group": "动作", "name": "看书", "path": "动作/04-看书.png"}, {"group": "动作", "name": "写笔记", "path": "动作/05-写笔记.png"}, {"group": "动作", "name": "完成", "path": "动作/06-完成.png"}];
function render(filter){document.getElementById('grid').replaceChildren(...items.filter(x=>filter==='全部'||x.group===filter).map(x=>{const el=document.createElement('article');el.className='card';const a=document.createElement('a');a.href=x.path;a.target='_blank';const img=document.createElement('img');img.src=x.path;img.alt=x.group+'｜'+x.name;img.loading='lazy';a.append(img);const cap=document.createElement('div');cap.className='caption';cap.textContent=x.name;const small=document.createElement('small');small.textContent=x.group;cap.append(small);a.append(cap);el.append(a);return el}))}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.filter)});render('全部');
</script></html>
